[package]
name = "workout-timer"
version = "1.3.0"
edition = "2021"
description = "A sport training application for Linux, built with GTK 4 and libadwaita"
license = "MIT"

[[bin]]
name = "training"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_18"] }
libadwaita = { version = "0.9", features = ["v1_7"] }
gstreamer = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "gzip"] }
libc = "0.2"
async-channel = "2"

[profile.release]
opt-level = 2