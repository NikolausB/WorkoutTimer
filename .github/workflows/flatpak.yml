name: CI

on:
  push:
    branches: [main, "feat/**", "vibe/**"]
  pull_request:
    branches: [main, "feat/**", "vibe/**"]

jobs:
  test:
    name: cargo test (GNOME 51 sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak + xvfb
        run: sudo apt-get update && sudo apt-get install -y flatpak dbus xvfb
      - name: Add Flathub remote
        run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Install runtimes
        run: >
          flatpak install --user -y flathub
          org.gnome.Platform//51 org.gnome.Sdk//51
          org.freedesktop.Sdk.Extension.rust-stable//26.08
          org.flatpak.Builder
      # flathub-build bundles a current flatpak-builder + flatpak; the runner's
      # apt flatpak is too old for the --device-if conditional (flatpak 1.17+).
      # The wrapper supplies its own builddir/repo/force-clean, so only pass
      # options and the manifest. Its flatpak needs a session D-Bus, which
      # headless runners don't have - dbus-run-session provides one.
      # --disable-rofiles-fuse: fuse fd passing does not work inside the
      # nested org.flatpak.Builder sandbox on GitHub runners
      # ("fusermount: file descriptor is not a socket").
      - name: Build the app
        run: >
          dbus-run-session --
          flatpak run --command=flathub-build org.flatpak.Builder
          --disable-rofiles-fuse
          io.github.NikolausB.WorkoutTimer.yml
      - name: Install the app
        run: flatpak install --user -y --noninteractive repo io.github.NikolausB.WorkoutTimer
      - name: Materialize the offline cargo home
        run: python3 .github/scripts/materialize-cargo-home.py cargo-sources.json .ci-cargo
      - name: Run cargo test in the SDK sandbox
        run: >
          xvfb-run -a -s "-screen 0 1280x1024x24 -ac" flatpak run --user
          --runtime=org.gnome.Sdk --runtime-version=51
          --command=sh
          --env=DISPLAY="$DISPLAY" --env=SRCDIR="$PWD"
          --env=CARGO_HOME="$PWD/.ci-cargo" --env=CARGO_NET_OFFLINE=true
          --filesystem="$PWD"
          io.github.NikolausB.WorkoutTimer
          -c 'cd "$SRCDIR" && export PATH=/usr/lib/sdk/rust-stable/bin:$PATH && cargo test'

  build:
    name: Flatpak build + lint
    runs-on: ubuntu-latest
    # Every run re-downloads the GNOME 51 runtime/SDK (~2 GB) and rebuilds
    # all crates; runner network/disk speed varies a lot, so the build
    # regularly takes anywhere from ~5 to 20+ minutes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak
        run: sudo apt-get update && sudo apt-get install -y flatpak dbus
      - name: Add Flathub remote
        run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Install runtimes
        # The rust-stable extension must be pre-installed at its real branch:
        # flatpak-builder only resolves the unversioned sdk-extension via
        # the SDK's metadata when it is already present, otherwise it falls
        # back to the non-existent runtime-version branch (51).
        run: >
          flatpak install --user -y flathub
          org.gnome.Platform//51 org.gnome.Sdk//51
          org.freedesktop.Sdk.Extension.rust-stable//26.08
          org.flatpak.Builder
      - name: Build
        run: dbus-run-session -- flatpak run --command=flathub-build org.flatpak.Builder --disable-rofiles-fuse io.github.NikolausB.WorkoutTimer.yml
      - name: Lint manifest
        run: timeout 300 flatpak run --user --command=flatpak-builder-lint org.flatpak.Builder manifest io.github.NikolausB.WorkoutTimer.yml
        continue-on-error: true
