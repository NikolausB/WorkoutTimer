app-id: io.github.NikolausB.WorkoutTimer
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: training
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --device=all
  - --share=ipc
  - --share=network
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/training/cargo
    CARGO_NET_OFFLINE: 'true'
modules:
  - name: training
    buildsystem: meson
    config-opts:
      - --buildtype=release
    builddir: true
    sources:
      - type: dir
        path: .
      - cargo-sources.json